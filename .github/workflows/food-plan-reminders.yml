name: Remind Tanvi to confirm the weekly food plan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-food-plan-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send reminder when this week is not confirmed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Food-plan reminder secret is missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://www.mo-tshirt.mu/api/admin/couple-goals/food-email
