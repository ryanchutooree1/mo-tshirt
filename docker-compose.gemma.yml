services:
  ollama:
    image: ollama/ollama:latest
    container_name: mo-tshirt-gemma
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - mo_tshirt_gemma_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  gemma-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${GEMMA_MODEL:-gemma3:1b}"]
    volumes:
      - mo_tshirt_gemma_models:/root/.ollama
    restart: "no"

volumes:
  mo_tshirt_gemma_models:
