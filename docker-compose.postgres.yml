services:
  postgres:
    image: postgres:16-alpine
    container_name: mo-tshirt-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: mo_tshirt
      POSTGRES_PASSWORD: mo_tshirt_dev
      POSTGRES_DB: mo_tshirt_docker_test
    ports:
      - "54329:5432"
    volumes:
      - mo_tshirt_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mo_tshirt -d mo_tshirt_docker_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mo_tshirt_postgres_test_data:
